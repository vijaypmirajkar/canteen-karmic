<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Karmic Canteen — Employee</title>
  <style>
    body {
      background: url('https://images.unsplash.com/photo-1600891964599-f61ba0e24092?w=1600&q=80&auto=format&fit=crop') no-repeat center center/cover;
      min-height: 100vh;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px;
    }

    h1 {
      margin-top: 30px;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.5);
    }

    .foods {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
      width: 90%;
      max-width: 900px;
    }

    .food {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .food:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }

    .food img {
      width: 100%;
      border-radius: 10px;
      height: 120px;
      object-fit: cover;
    }

    .selected {
      background: rgba(0, 255, 100, 0.4) !important;
      transform: scale(1.05);
    }

    button {
      background: #ff9800;
      border: none;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      margin-top: 30px;
      transition: 0.3s;
    }

    button:hover {
      background: #ffa726;
      transform: scale(1.05);
    }

    /* Popup styles */
    .popup {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.85);
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      color: white;
      width: 80%;
      max-width: 400px;
      z-index: 1000;
    }

    .popup h2 {
      margin-bottom: 10px;
    }

    .popup ul {
      list-style: none;
      padding: 0;
    }

    .popup li {
      margin: 5px 0;
    }

    .popup button {
      margin-top: 15px;
      background: #4caf50;
    }
  </style>
</head>
<body>
  <h1>Select Your Meal</h1>
  <div class="foods">
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/07/poori-recipe.jpg" alt="Poori">
      <p>Poori</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/07/chapathi.jpg" alt="Chapathi">
      <p>Chapathi</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/07/paneer-butter-masala.jpg" alt="Paneer Butter Masala">
      <p>Paneer Butter Masala</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/06/butter-naan.jpg" alt="Butter Naan">
      <p>Butter Naan</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/06/roti-recipe.jpg" alt="Roti">
      <p>Roti</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2022/07/chicken-fry.jpg" alt="Chicken Fry">
      <p>Chicken Fry</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/06/veg-salad.jpg" alt="Salad">
      <p>Salad</p>
    </div>
    <div class="food" onclick="selectFood(this)">
      <img src="https://www.indianhealthyrecipes.com/wp-content/uploads/2021/06/vegetable-pulao.jpg" alt="Pulav">
      <p>Pulav</p>
    </div>
  </div>

  <input type="text" id="employeeName" placeholder="Enter your name" style="padding:8px;border-radius:6px;border:none;margin-top:20px;">

  <button onclick="submitSelection()">Submit Meal</button>

  <!-- Popup confirmation -->
  <div id="popup" class="popup">
    <h2>Your Selected Meals</h2>
    <ul id="selectedItems"></ul>
    <button onclick="closePopup()">Close</button>
  </div>

 <script>
  function selectFood(el) {
    el.classList.toggle('selected');
  }

  function submitSelection() {
    const name = document.getElementById('employeeName').value.trim();
    const selected = document.querySelectorAll('.food.selected p');

    if (!name) {
      alert("Please enter your name!");
      return;
    }

    if (selected.length === 0) {
      alert("Please select at least one meal!");
      return;
    }

    const meals = Array.from(selected).map(item => item.textContent);

    // Send data to PHP using fetch
    fetch('save_meal.php', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        employee_name: name,
        meals: meals
      })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        alert("Meal saved successfully!");
        // Optionally reset selections
        document.querySelectorAll('.food.selected').forEach(el => el.classList.remove('selected'));
        document.getElementById('employeeName').value = '';
      } else {
        alert("Error: " + data.message);
      }
    })
    .catch(err => alert("Request failed: " + err));
  }
</script>

</body>
</html>
